services:
  mongodb:
    image: mongo:7
    container_name: week1-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: week1_nosql

  postgres:
    image: postgres:16
    container_name: week1-pg
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: week1_nosql

volumes:
  mongo_data:
  pg_data:
