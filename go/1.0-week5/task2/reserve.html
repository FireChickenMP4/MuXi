<script>
    (function () {
        var calendar_para = {};//calendar私有公共参数
        if (typeof (uni_calendar_dft_opt) != "object") uni_calendar_dft_opt = {};//外部配置
        var idlg = $("#dlg_resv_panel_default_639003805261085824");//公共dlg对象
        $(function () {
            //查询到座位图标放入待选中DIV中
            $("#fp_Select_Btn").click(function () {
                var strat = $("#fp_Select_Strat").val();
                var end = $("#fp_Select_End").val();
                if (strat.trim() != "" && end.trim() != "") {
                    var index = 0;
                    $(".fp-box").removeClass("fp-box-sel");
                    for (var i = parseInt(strat) - 1; i <= parseInt(end); i++) {
                        index++;
                        var divobj = $("div[index$=" + i + "]");
                        if (divobj.hasClass("fp-box")) {
                            $(".ul_items").append("<li value=" + i + ">" + i + "、<span>" + divobj.attr("title") + "</span><a  class='click del RemoveSelect'>×</a></li>")
                            divobj.addClass("fp-box-sel");
                        }
                    }
                    //$(".RemoveSelect").ubind("click")
                    $(".RemoveSelect").click(function () {
                        var divobj = $("div[index$=" + parseInt($(this).parent().attr("value")) + "]");
                        if (divobj.hasClass("fp-box")) {
                            divobj.removeClass("fp-box-sel");
                            $(this).parent().remove();
                        }
                    })
                }

            })

            $("#fp_Select_One").click(function () {
                var Select = $("#fp_Select").val();
                if (Select != "") {
                    var divobj = $("div[index$=" + (parseInt(Select) - 1) + "]");
                    if (!divobj.hasClass("fp-box")) {
                        return;
                    }
                    if (!divobj.hasClass("fp-box-sel")) {
                        divobj.addClass("fp-box-sel");
                    }
                    $(".ul_items").append("<li value=" + (parseInt(Select) - 1) + ">" + (parseInt(Select) - 1) + "、<span>" + divobj.attr("title") + "</span><a  class='click del RemoveSelect'>×</a></li>")
                    // $(".RemoveSelect").ubind("click")
                    $(".RemoveSelect").click(function () {
                        var divobj = $("div[index$=" + parseInt($(this).parent().attr("value")) + "]");
                        if (divobj.hasClass("fp-box")) {
                            divobj.removeClass("fp-box-sel");
                            $(this).parent().remove();
                        }
                    })
                }
            })

            var disable = "false";
            if (disable == "true") return;//停止初始化
            //解析参数
            var req = uni.getReq();
            var purl = uni.getObj(uni_calendar_dft_opt);
            debugger;
            //过滤掉函数
            for (var key in purl) {
                if (typeof (purl[key]) == "function") purl[key] = null;
            }

            //
            calendar_para.src_type = "rm";
            calendar_para.classkind = purl.classkind = req["classKind"] || "8" || purl.classkind;
            calendar_para.test_id = purl.test_id = req["testId"] || purl.test_id;//教学实验项目号
            calendar_para.term = purl.term = req["term"] || purl.term;//教学学期
            calendar_para.display = purl.display = req["display"] || purl.display || "fp";
            purl.islong = req["isLong"] || "" || purl.islong;
            var alone = req["alone"] || "false";
            if (alone == "true") purl.alone = true;
            purl.iskind = req["isKind"] || "" || purl.iskind;
            purl.md = purl.md || ((purl.islong || "").toLowerCase() == "true" ? "m" : "d");
            purl.class_id = req["classId"] || "" || purl.class_id;
            purl.lab_id = req["labId"] || "" || purl.lab_id;
            purl.kind_id = req["kindId"] || "" || purl.kind_id;
            purl.room_id = req["roomId"] || "101699179" || purl.room_id;
            purl.dev_id = req["dev"] || "" || purl.dev_id;
            purl.operate = req["operate"] || purl.operate;
            purl.purpose = purl.purpose || "";
            purl.selectOpenAty = "";//4-26新增
            var selDate = req["click"] == "false" ? undefined : SelDateTime;
            var width = parseInt(req["w"] || "" || "840");
            purl.img = req["img"] || "../../upload/DevImg/FloorPlan/rm101699179.jpg" || purl.img;
            purl.cld_name = purl.cld_name || "default";//状态控件名
            //获取实例
            var panel = $("#calendar_639003805261085824");
            panel.attr("name", purl.cld_name);
            var calendar;
            //载入状态控件
            var kvp = uni.getObj(purl);
            function loadCld(filter) {
                if (filter && typeof (filter) == "object") $.extend(true, kvp, filter);
                //不需要传的值
                delete kvp.img;
                //
                var vconfigInterBase = "180";
                var vconfigRes = parseInt("180" || 10)
                var selectTimeRes = false;
                if (vconfigInterBase == "0") {
                    var vEndTime = 20 * 60;
                    var dateNow = new Date();
                    dateNow = timeStep(dateNow);
                    vconfigInterBase = vEndTime - dateNow.getHours() * 60 - dateNow.getMinutes();
                    selectTimeRes = true;
                }

                if (kvp.display == "fp") {//平面图
                    calendar = panel.uniFloorPlan({
                        width: width,
                        img: purl.img,
                        allDay: (parseInt("0") & parseInt(calendar_para.classkind)) > 0,
                        step: parseInt("5" || 10),
                        interval: vconfigInterBase,
                        isEdit: (pro.isLogin() && (parseInt(pro.acc.ident) & 268435456) > 0),
                        selectTime: selectTimeRes,
                        evInit: function (callback) {
                            pro.j.dev.getDevCoord(kvp, function (rlt) {
                                callback(rlt);
                            });
                        },
                        evSelDot: selDate,
                        evUpTime: function (date, start, end, callback) {
                            var pra = kvp || {};
                            pra.date = date;
                            if (start && end) {
                                pra.fr_start = start;
                                pra.fr_end = end;
                            }
                            else {
                                pra.fr_all_day = "true";
                            }
                            pro.j.dev.getRsvSta(pra, function (rlt) {
                                var list = rlt.data;
                                var search = $(".fp-user-search");
                                var hourMin = 8;
                                var hourMax = 23;
                                var OpenEndMinute = 0;
                                var OpenStartMinute = 0;
                                if (rlt.data.length > 0 && rlt.data[0].openStart != null) {
                                    hourMin = parseInt(rlt.data[0].openStart.split(":")[0]);
                                    hourMax = parseInt(rlt.data[0].openEnd.split(":")[0]);
                                    OpenStartMinute = parseInt(rlt.data[0].openStart.split(":")[1]);
                                    OpenEndMinute = parseInt(rlt.data[0].openEnd.split(":")[1]);
                                }
                                $(".fp-time-start,.fp-time-end").attr("readonly", "true").timepicker({
                                    controlType: 'select',
                                    timeFormat: "HH:mm",
                                    onClose: function () { search.trigger("click"); },
                                    stepHour: 1,
                                    stepMinute: 10,
                                    hourMin: hourMin,
                                    hourMax: hourMax,
                                    OpenEndMinute: OpenEndMinute,
                                    OpenStartMinute: OpenStartMinute,
                                });
                                callback(list, "unilab3", { showClose: ("1" == "1" ? true : false) });
                            });
                        },
                        evSaveCoorb: function (para, boxs, callback) {
                            var str = para.width + "&" + para.height + "&" + para.istitle;
                            var list = boxs.values();
                            $.each(list, function () {
                                str += "&" + this.key + "," + this.css("top") + "," + this.css("left") + "," + this.sz;
                            });
                            pro.j.dev.setDevCoord(kvp, str, callback);
                        },
                        evUsable: function (devids,callback) {
                              pro.j.dev.setUsable(devids, callback);
                        },
                        evUnable:function (devids,callback) {
                              pro.j.dev.setUnable(devids, callback);
                        },
                        evFinish: function (fp) {
                            var search = $(fp).find(".fp-user-search");
                            if ("0" == "1") {
                                $(".fp-time-start").attr("disabled", "true");
                            }
                            $(fp).find(".fp-date").attr("readonly", "true").datepicker({
                                minDate: 0,
                                language: 'en',
                                onClose: function () {
                                    if (new Date().toDateString() == new Date($(".fp-dt-input").val()).toDateString() && "0" == "1") {
                                        // $(".fp-time-start").val((new Date()).format("HH:mm"));
                                        $(".fp-time-start").attr("disabled", "true");
                                    } else {
                                        $(".fp-time-start").removeAttr("disabled");
                                    }
                                },
                            });
                            //$(fp).find(".fp-time-start,.fp-time-end").attr("readonly", "true").timepicker({
                            //        controlType: 'select',
                            //        timeFormat: "HH:mm",
                            //        onClose: function () { search.trigger("click"); },
                            //        stepHour: 1,
                            //        stepMinute: 10,
                            //        hourMin: 6,
                            //        hourMax: 23
                            //});
                        }
                    });
                }
                else if (kvp.display == "cld") {//状态列表
                    calendar = panel.uniCalendar({
                        mode: kvp.md,
                        modes: kvp.md,
                        style: kvp.style || "dft",
                        alone: kvp.alone || false,
                        operate: kvp.operate || 'drag',
                        width: width,
                        objTitleMinWidth: 100,
                        pctrl: { num: 20, triggerHeight: kvp.triggerHeight || 120 },//定义即启用
                        evSelTime: selDate,
                        dayOpt: {
                            unit: parseInt("5" || 10),
                            evSelObj: function (data) {
                                if (pro.calendar && pro.calendar.selObjFun) {//不能定义在hrload页面内
                                    pro.calendar.selObjFun(data.obj);
                                }
                            }
                        },
                        evUpTime: function (date, callback, options) {
                            var pra = kvp || {};
                            pra.date = date.format("yyyyMMdd");
                            //if (kvp.islong == "true")
                            //pra.ck_close = "true";//检查开放区间不开放日期 耗资源
                            pro.j.dev.getRsvSta(pra, function (rlt) {
                                var list = rlt.data;
                                if (list.length > 0) {
                                    if ((list[0].limit & 1024) > 0) {//预约不检测冲突
                                        options.dayOpt.occupy = false;//时间条不覆盖全部
                                    }
                                }
                                //if(list.length==0) uni.msgBox("没有获取到数据");
                                callback(list, "unilab3", { byType: kvp.byType || "lab", showClose: ("1" == "1" ? true : false), DistanceEndTime: ("0") });
                            });
                        },
                        evFinishDraw: function (dt, date, opt, iqz, more) {
                            if (uni_calendar_dft_opt.finishDraw) uni_calendar_dft_opt.finishDraw(date, opt, iqz, more);
                        }
                    });
                }
            }
            //默认自动加载
            if (purl.auto_load != "false" && purl.classkind != undefined) {
                loadCld();
            }

            //记录对象
            if (pro.calendar) {
                if (!pro.calendar.instants) pro.calendar.instants = {};
                var cld = {};
                cld.type = purl.display;
                cld.instant = calendar;
                cld.reload = loadCld;
                pro.calendar.instants[purl.cld_name] = cld;
            }
            //点击刷新
            if (purl.display == "cld") {
                $(".resv_stat").click(function () {
                    if (calendar)
                        calendar.uploadCld();
                });
            }
        });
        function timeStep(dt) {
            var t = dt.getMinutes();
            var diff = t % 10;
            if (diff > 0) {
                dt.addMinutes(10 - diff);
            }
            return dt;
        }
        function SelDateTime(data) {
            if (!pro.isloginL(function () { SelDateTime(data) })) return;//判断登录
            if ("" != "") {
                var time ="";
                pro.j.rsv.getServertime(function (result) {
                    var a = result.data[1].split(":");
                    var b = time.split(":");
                    var date = new Date();
                    if (date.setHours(b[0], b[1]) > date.setHours(a[0], a[1])) {
                        uni.msgBox("在" + time + "之后可预约");
                        return false;
                    } else {
                        setdata(data)
                    }
                })
            } else {
                setdata(data)
            }

        }
        function setdata(data) {

            var k = "0";//预约须知
            var kind = "";//预约须知
            $("#classkind").val(data.obj.clskind) //传入类型
            if (!(kind & data.obj.clskind) > 0) {
                k = "";
            }
            if (k == "" || k == "0")
                Show(data);
            else {
                var para = {};//通用
                var obj = data.obj;
                if (k == "2") {
                    var prefix = "";
                    var forSub = parseInt("0");
                    if (obj.clskind == "2" && (forSub & 2) > 0) prefix = "cpt";
                    else if (obj.clskind == "8" && (forSub & 8) > 0) prefix = "seat";
                    if (calendar_para.src_type == "rm") {
                        para.type = "rm_" + prefix + "rule";//房间
                        para.id = obj.roomId;
                    }
                    else if (calendar_para.src_type == "kind") {
                        para.type = "kind_" + prefix + "rule";//类型
                        para.id = obj.kindId;
                    }
                    else if (calendar_para.src_type == "dev") {
                        para.type = "dev_" + prefix + "rule";//设备
                        para.id = obj.devId;
                    }
                    else if (calendar_para.src_type == "lab") {
                        para.type = "lab_" + prefix + "rule";//按楼层显示
                        para.id = obj.labId;
                    }
                    else if (obj.classId) {
                        para.type = prefix + "rule";//类别
                        para.id = obj.classId;
                    }
                }
                pro.d.other.resvNotice(null, para, function (dlg) {
                    if (dlg.agree) {
                        Show(data);
                    }
                });
            }
        }
        function Show(data) {//外层定义检查回调函数
            if (uni_calendar_dft_opt.cusPrepare) {
                data.obj.OnlyopenAty = "";//仅支持活动
                uni_calendar_dft_opt.cusPrepare(data, ShowForm);
            }
            else {
                ShowForm(data);
            }
        }
        //预约类型
        function ShowForm(data) {
            var md = data.md;
            var obj = data.obj;
            var dlg = idlg;//$(idlg.html());
            //初始化备选项
            if ((parseInt("1" || 0) & 4) > 0) {
                pro.j.util.getCodeTbl(9, '', function (rlt) {//服务=9
                    var arr = rlt.data;
                    var str = "";
                    for (var i = 0; i < arr.length; i++) {
                        str += "<span class='spare_item'>" + arr[i].szCodeName + "</span>";
                    }
                    $(".spare_items", dlg).html(str);
                    var spare = $(".spare_item", dlg);
                    var memo = $(".spare_con", dlg);
                    spare.click(function () {
                        var pthis = $(this);
                        var v = pthis.html() + ',';
                        if (pthis.hasClass("selected")) {
                            pthis.removeClass("selected");
                            var ht = memo.val();
                            memo.val(ht.replace(v, ''));
                        }
                        else {
                            pthis.addClass("selected");
                            memo.val(v + memo.val());
                        }
                    })
                });
            }
          
            //初始化时间  
            obj.date = data.dt;
            if (data.startT) {
                obj.startDate = data.startD;
                obj.endDate = data.endD;
                obj.start = data.startT;
                obj.end = data.endT;
            }
            else {
                obj.start = data.start;
                obj.end = data.end;
            }
            //教师排课
            if ("0" == "1" && (parseInt(pro.acc.ident) & 512) > 0) {
                obj.cycleDate = true;
                $(".prop", dlg).val(8);//lock_room属性=8 custom
                //$(".tr_theme", dlg).removeClass("hidden");//是否需要/必须填写课题 交由resvTheme配置项确定
                //$(".con_theme", dlg).addClass("must");
                //$(".name_theme", dlg).html("<span class='red'>*</span>课程");
            }
            else
                $(".prop", dlg).val("");
            //主题显示检测
            var clsk = parseInt("1");
            if (clsk) {
                if ((clsk & (calendar_para.classkind || 0)) == 0) {
                    $(".tr_theme", dlg).addClass("hidden");
                    clsk = false;//当前类型不显示主题
                }
            }
            //教学实验项目
            if (calendar_para.test_id && calendar_para.term) {
                $(".test_id", dlg).val(calendar_para.test_id);
                $(".term", dlg).val(calendar_para.term);
            }
            //按类型与否赋值
            var tmp = obj.id.split("_");//20150610前为&
            var id = tmp[0];
            $(".lab_id", dlg).val(tmp[1]);
            $(".type", dlg).val(obj.type || "dev");
            if (obj.type == "kind") {
                $(".kind_id", dlg).val(id);
                $(".room_id", dlg).val(tmp[2] || "");
            }
            else {
                $(".kind_id", dlg).val(obj.typeId);
                $(".dev_id", dlg).val(id);
            }
            //按长期与否分别初始化
            if (obj.islong) {
                //异步获取开放时间
                if (obj.type == "kind")
                    pro.j.dev.getDevKindRsvSta(id, obj.date, function (rlt) {
                        obj.open = rlt.data.open;
                        openResvDlg(dlg, obj);
                    });
                else
                    pro.j.dev.getDevRsvSta(id, obj.date, function (rlt) {
                        obj.open = rlt.data.open;
                        openResvDlg(dlg, obj);
                    });
            }
            else {
                openResvDlg(dlg, obj);
            }
            //注册提交事件
            var sub_btn = $(".mt_sub_resv", dlg);
            if (!sub_btn.hasClass("inited")) {
                sub_btn.addClass("inited");
                sub_btn.click(function () {
                    //如果显示主题
                    if (clsk) {
                        //如果可输入主题
                        if (parseInt("2") == 2) {
                            //如果主题为空
                            var value = $(".con_theme").val(); // 获取值
                            value = $.trim(value); // 用jQuery的trim方法删除前后空格
                            if (value == '' || value == null) {// 判断是否是空字符串，而不是null
                                uni.msgBox("输入主题不能为空或空格!");
                                return false;
                            }
                        }
                    };
                    //验证申请说明字符长度
                    var MemoMinLen = parseInt("");
                    if (0 > 0 && MemoMinLen > 0) {
                        if ($("#resvMemo").val().length <= MemoMinLen) {
                            uni.msgBox("申请说明最少输入" + MemoMinLen + "个字!");
                            return false;
                        }
                    }
                    if (dlg.mustItem())
                        if (0> 0) {
                            $("#Show_Number_Code").html("");
                            pro.j.rsv.SetNumberCode("", function (data) {
                                var imgdata = data.data;
                                var host = "../../../"; //location.host + "/"; 
                                $("#Show_Number_Code").html("<img src='" + host + imgdata[0] + "' class='imgcode'/><img  class='imgcode' src='" + host + imgdata[1] + "'/><span class='codespan'>" + imgdata[4] + "</span><img  class='imgcode'src='" + host + imgdata[2] + "'/><img  class='imgcode'src='" + host + imgdata[3] + "'/><span class='codespan'>=</span><input type='text' class='codeinput'/>");
                                uni.dlg($("#Show_Number_Code"), "输入验证码", 200, 200, function () {
                                    $(".Vnumber").val($(".codeinput").val())
                                    $("#Show_Number_Code").dialog("close");
                                    debugger;
                                    subUserResv(this, obj);
                                })
                            })
                        } else {
                            subUserResv(this, obj);
                        }

                });
            }
        }
        function openResvDlg(dlg, obj) {
            if (obj.islong) {
                var open = obj.open;
                if (open && open.length > 1) {
                    obj.openStart = open[0];
                    obj.openEnd = open[1];
                }
                else {
                    uni.msgBox("所选日期不开放");
                    return;
                }
            }
            //固定时间段
            if (obj.ops && obj.ops.length > 0 && (obj.ops[0].limit & 2) > 0) {
                obj.fix = true;
                //{ };
            }
            pro.d.basic.addDateTimePicker($(".dlg_dt_panel", dlg), obj);
            //初始化状态条
            if ("1" == "1" && obj.allowLong == false) {
                $(".rsv_state_slider", dlg).stateSlider(obj, { start: $(".md_date .mt_start_time", dlg), end: $(".md_date .mt_end_time", dlg), width: 410 });
            }
            //当天且开始时间不可选
            if ("0" == "1") {
                $(".mt_start_time").click(function () { alert("不可选择开始时间"); return false; });
                if (new Date().addDays("1").toDateString() == new Date($(".fp-dt-input").val()).toDateString()) {//明天
                    //$(".mt_start_time").removeAttr("disabled");
                    $(".mt_start_time option:last").prop("selected", 'selected');
                } else {
                    $($(".mt_start_time")[2]).append("<option value='" + new Date().format("HH:mm") + "'>" + new Date().format("HH:mm") + "</option>")
                    $(".mt_start_time option:last").prop("selected", 'selected');
                }
                $(".hd_start").val($(".hd_start").val().split(" ")[0] + " " + new Date().format("HH:mm"));
            }
            //成员添加
            if (parseInt(obj.maxUser) < 2) $(".md_group", dlg).hide();
            else {
                $(".md_group", dlg).show();

                var mb_panel = $(".dlg_mb_panel", dlg);
                if ($.trim(mb_panel.html()) == "") {
                    var para = { md: "simple" };
                    if (calendar_para.test_id) {//教学组
                        para.md = "complex";
                        para.test_id = calendar_para.test_id;
                    }
                    else {//普通组
                        if (obj.maxUser > 30) para.md = "complex";
                        para.min = obj.minUser;
                        para.max = obj.maxUser;
                    }
                    pro.d.basic.mGroupMembers(mb_panel, para);
                }
            }
            //上传文件
            if ((parseInt(obj.limit) & 8) > 0 || ("0" == "1" && (parseInt(calendar_para.classkind || 0) & 1) > 0)) //limit=8必须上传附件 研修间类型可上传
            {
                var upFile = $(".upload_file", dlg).uploadFile();
            }
            else
                $(".file_up_panel", dlg).hide();
            //规则详细
            $(".div_remark", dlg).html(pro.htm.getResvRule(obj));
            //参数
            $(".rsv_obj_name", dlg).html(uni.backText(obj.title));
            $(".apply_people", dlg).html(pro.acc.name);
            //打开窗口
            //$(".mt_sub_resv", dlg).removeAttr("disabled");
            uni.dlg(dlg, "预约申请", 460, 600);
        }
        //提交预约
        function subUserResv(btn, obj) {

            btn = $(btn);

            var dlg = $("#dlg_resv_panel_default_639003805261085824")//btn.parents(".dialog:first");
            //btn.attr({ "disabled": "disabled" });

            pro.j.rsv.fRsv("set_resv", $("form:first", dlg), function () {
                if (uni_calendar_dft_opt.submitSuc) {
                    uni_calendar_dft_opt.submitSuc(dlg, obj);
                }
                else {
                    var msg = '申请提交成功，是否跳转查看预约信息?';
                    if (parseInt(obj.minUser) > 1) {
                        //var min = "<span style='color:red;font-size:bold;'>" + obj.minUser + "</span>";
                        msg += "<br/><br/><div style='font-weight:bold;'>" + uni.translate("注意！生效后需至少" + obj.minUser + "人刷卡，否则将记为违约！") + "</div>";
                    }
                    uni.confirm(msg, function () {
                        $("#user_center").trigger("click");
                    }, function () {
                        uni.reload();
                    });
                    $(".group_id", dlg).val("");
                    $(".group_name", dlg).html("小组未创建");
                    dlg.dialog("close");
                }
                //btn.removeAttr("disabled");
            }, function (rlt) {

                uni.msgBox(pro.translate(rlt.msg));
                //btn.removeAttr("disabled");
            }, function () {
                uni.msgBox(uni.translate("异步连接出现异常！"));
                //btn.removeAttr("disabled");
            });
        }
    })()

    <script>
        function subDevResv() {
            var cld = $("#form_default");
            //名称
            var mt = $(".yard_name", cld);
            var name = $.trim(mt.val());
            mt.val(name);
            if (!name) {
                uni.msgBox("活动名称不能为空！");
                return false;
            }
            //审核类型
            var ck = 0;
            ck += parseInt(($(".director_v", cld).val()) || 0);
            ck += parseInt(($(".devman_v", cld).val()) || 0);
            $(".service_v:checked", cld).each(function () {
                var v = parseInt($(this).val());
                if (!isNaN(v))
                    ck += v;
            });
            $(".ck_kind", cld).val(ck);
            var dts = $(".director:checked", cld);
            var value = 0;
            dts.each(function () {
                var v = parseInt($(this).val());
                if (!isNaN(v))
                    value += v;
            });
            if (value > 0) {
                $("input[name=director]", cld).val(value);
            }
            //组成员
            var mbs = "";
            $(".yard_memList input[name=memid]", cld).each(function () {
                mbs += $(this).val() + ",";
            });
            $("input[name=mb_list]", cld).val(mbs);
            $(".mt_sub_resv", cld).attr({ "disabled": "disabled" });
            pro.j.rsv.fRsv("set_yard_rsv", $("form", cld), function () {
                uni.confirm("申请提交成功，是否跳转到个人中心？", function () {
                    $("#user_center").trigger("click");
                }, function () {
                    uni.reload();
                });
                $(".mt_sub_resv", cld).removeAttr("disabled");
                cld.dialog("close");
            }, function (rlt) {
                uni.msgBox(rlt.msg);
                $(".mt_sub_resv", cld).removeAttr("disabled");
            }, function () {
                uni.msgBox("异步连接出现异常！");
                $(".mt_sub_resv", cld).removeAttr("disabled");
            });
        }
        function SelDateTime(data) {
            var dlg = $("#form_default");
            var md = data.md;
            var obj = data.obj;
            var devid = obj.devId;
            var devname = obj.name;
            var date = data.dt;
            //成员限制
            $(".min_user", dlg).html(obj.minUser);
            $(".max_user", dlg).html(obj.maxUser);
            //上传文件
            var upFile = $(".upload_file", dlg).uploadFile();
            //初始化时间
            $(".mt_begin_date", dlg).val(date + " 08:00");
            $(".mt_end_date", dlg).val(date + " 20:00");
            var start = obj.openStart.split(":");
            var end = obj.openEnd.split(":");
            var h_start = parseInt(start[0]);
            var h_end = parseInt(end[0]);
            var m_start = parseInt(start[1]);
            var m_end = parseInt(end[1]);
            var hour;
            if (md == "d")
                hour = parseInt(data.h);
            else if (md == "m")
                hour = h_start;
            var beginH = uni.num2Str(hour, 2) + ":00";
            var beginT = uni.num2Str(h_start, 2) + ":" + uni.num2Str(m_start, 2);
            var endH;
            var endT = uni.num2Str(h_end, 2) + ":" + uni.num2Str(m_end, 2);
            if (hour == h_end)
                endH = endT;
            else
                endH = uni.num2Str(hour + 1, 2) + ":00";
            $(".mt_begin_date", dlg).val(date + " " + beginH);
            $(".mt_end_date", dlg).val(date + " " + endH);
            //日期控件
            $(".Wdate").datetimepicker({
                controlType: 'select',
                timeFormat: "HH:mm",
                dateFormat: "yy-mm-dd",
                stepHour: 1,
                stepMinute: 1,
                hourMin: h_start,
                hourMax: h_end
            });

            var remark = $(".div_remark", dlg);
            $(".open_t_start", remark).html(beginT);
            $(".open_t_end", remark).html(endT);
            var earliest = obj.earliest ? pro.dt.m2dms(obj.earliest) : "不限制";
            var latest = obj.latest ? pro.dt.m2dms(obj.latest) : "不限制";
            var max = obj.max ? pro.dt.m2dms(obj.max) : "不限制";
            var min = obj.min ? pro.dt.m2dms(obj.min) : "不限制";
            $(".rule_t_earliest", remark).html(earliest);
            $(".rule_t_latest", remark).html(latest);
            $(".rule_t_max", remark).html(max);
            $(".rule_t_min", remark).html(min);
            $(".mt_sub_resv", dlg).removeAttr("disabled");
            $("input[name=dev_id]", dlg).val(devid);
            $('.rsv_dev_name', dlg).html(devname);
            //打开窗口
            uni.dlg(dlg, "设备预约", 760, 402);
            //dlg.modal({show:true});
        }

    </script>
