<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Go WebSocket 聊天室</title>
    <style>
      /* 样式保持不变，只是修复CSS语法错误 */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .chat-container {
        max-width: 900px;
        margin: 0 auto;
        background: white;
        border-radius: 15px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .header h1 {
        font-size: 24px;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .online-badge {
        background: rgba(255, 255, 255, 0.2);
        padding: 5px 15px;
        border-radius: 20px;
        font-size: 14px;
      }

      .connection-status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #4ade80;
        animation: pulse 2s infinite;
      }

      .status-dot.disconnected {
        background: #ef4444;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .chat-area {
        display: flex;
        height: 600px;
      }

      .sidebar {
        width: 250px;
        background: #f8fafc;
        border-right: 1px solid #e2e8f0;
        padding: 20px;
        overflow-y: auto;
      }

      .user-profile {
        text-align: center;
        padding-bottom: 20px;
        border-bottom: 1px solid #e2e8f0;
        margin-bottom: 20px;
      }

      .avatar {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-weight: bold;
        margin: 0 auto 10px;
      }

      .user-list h3 {
        margin-bottom: 15px;
        color: #64748b;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .user-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border-radius: 8px;
        margin-bottom: 8px;
        transition: background 0.2s;
      }

      .user-item:hover {
        background: #e2e8f0;
      }

      .user-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #4ade80;
      }

      .messages-container {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        background: #ffffff;
        display: flex;
        flex-direction: column;
      }

      .message {
        margin-bottom: 20px;
        max-width: 70%;
        animation: fadeIn 0.3s ease-in;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message.self {
        align-self: flex-end;
        margin-left: auto;
      }

      .message.other {
        align-self: flex-start;
      }

      .message-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 5px;
      }

      .message.self .message-header {
        justify-content: flex-end;
      }

      .message-username {
        font-weight: 600;
        color: #334155;
      }

      .message.self .message-username {
        color: #764ba2;
      }

      .message-time {
        font-size: 12px;
        color: #94a3b8;
      }

      .message-content {
        padding: 12px 16px;
        border-radius: 18px;
        display: inline-block;
        word-break: break-word;
        line-height: 1.4;
      }

      .message.other .message-content {
        background: #f1f5f9;
        border-bottom-left-radius: 4px;
      }

      .message.self .message-content {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-bottom-right-radius: 4px;
      }

      .system-message {
        text-align: center;
        margin: 15px 0;
        color: #64748b;
        font-size: 14px;
        font-style: italic;
        align-self: center;
        background: #f8fafc;
        padding: 8px 16px;
        border-radius: 20px;
        max-width: 80%;
      }

      .input-area {
        padding: 20px;
        border-top: 1px solid #e2e8f0;
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: #f8fafc;
      }

      .message-input {
        flex: 1;
        padding: 12px 20px;
        border: 2px solid #e2e8f0;
        border-radius: 25px;
        font-size: 16px;
        outline: none;
        transition: border 0.2s;
        background: white;
      }

      .message-input:focus {
        border-color: #667eea;
      }

      .message-input:disabled {
        background: #f1f5f9;
        cursor: not-allowed;
      }

      .send-button {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 25px;
        padding: 0 30px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }

      .send-button:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }

      .send-button:active:not(:disabled) {
        transform: translateY(0);
      }

      .send-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .upload-area {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .upload-button {
        background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        color: white;
        border: none;
        border-radius: 20px;
        padding: 8px 16px;
        font-size: 14px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: transform 0.2s;
      }

      .upload-button:hover {
        transform: translateY(-2px);
      }

      .upload-button input[type="file"] {
        display: none;
      }

      .upload-status {
        font-size: 14px;
        color: #64748b;
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .upload-progress {
        width: 100px;
        height: 4px;
        background: #e2e8f0;
        border-radius: 2px;
        overflow: hidden;
        display: none;
      }

      .upload-progress-bar {
        height: 100%;
        background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        width: 0%;
        transition: width 0.3s;
      }

      .message-image {
        max-width: 300px;
        max-height: 300px;
        border-radius: 12px;
        cursor: pointer;
        transition: transform 0.2s;
        border: 2px solid #e2e8f0;
      }

      .message-image:hover {
        transform: scale(1.02);
        border-color: #c7d2fe;
      }

      .image-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.9);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 2000;
      }

      .image-modal img {
        max-width: 90%;
        max-height: 90%;
        border-radius: 8px;
      }

      .image-modal-close {
        position: absolute;
        top: 20px;
        right: 20px;
        color: white;
        font-size: 30px;
        cursor: pointer;
        background: rgba(0, 0, 0, 0.5);
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .image-info {
        position: absolute;
        bottom: 20px;
        left: 0;
        right: 0;
        text-align: center;
        color: white;
        font-size: 14px;
        opacity: 0.8;
      }

      .notification {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 15px 20px;
        background: white;
        border-radius: 10px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        display: flex;
        align-items: center;
        gap: 10px;
        transform: translateX(150%);
        transition: transform 0.3s ease;
        z-index: 1000;
      }

      .notification.show {
        transform: translateX(0);
      }

      .notification.success {
        border-left: 4px solid #4ade80;
      }

      .notification.error {
        border-left: 4px solid #ef4444;
      }

      .notification.info {
        border-left: 4px solid #3b82f6;
      }

      .messages-container::-webkit-scrollbar {
        width: 8px;
      }

      .messages-container::-webkit-scrollbar-track {
        background: #f1f5f9;
        border-radius: 4px;
      }

      .messages-container::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }

      .messages-container::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      @media (max-width: 768px) {
        .chat-area {
          flex-direction: column;
          height: 70vh;
        }

        .sidebar {
          width: 100%;
          height: 150px;
          border-right: none;
          border-bottom: 1px solid #e2e8f0;
        }

        .message {
          max-width: 85%;
        }
      }

      .loader {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid #f3f3f3;
        border-top: 3px solid #667eea;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="chat-container">
      <div class="header">
        <h1>💬 Go WebSocket 聊天室</h1>
        <div class="status">
          <div class="connection-status">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">连接中...</span>
          </div>
          <div class="online-badge">
            在线: <span id="onlineCount">0</span> 人
          </div>
        </div>
      </div>

      <div class="chat-area">
        <div class="sidebar">
          <div class="user-profile">
            <div class="avatar" id="userAvatar">你</div>
            <div id="usernameDisplay">加载中...</div>
          </div>
          <div class="user-list">
            <h3>在线用户</h3>
            <div id="usersList">
              <div class="user-item">
                <div class="user-dot"></div>
                <span>等待连接...</span>
              </div>
            </div>
          </div>
        </div>

        <div class="messages-container" id="messagesContainer">
          <div class="system-message" id="welcomeMessage">
            ⏳ 正在连接到聊天室...
          </div>
        </div>
      </div>

      <div class="input-area">
        <div class="upload-area" id="uploadArea">
          <label class="upload-button">
            📸 选择图片
            <input
              type="file"
              id="imageInput"
              accept=".jpg,.jpeg,.png,.gif,.bmp,.webp"
            />
          </label>
          <div class="upload-status" id="uploadStatus">
            <div class="upload-progress" id="uploadProgress">
              <div class="upload-progress-bar" id="uploadProgressBar"></div>
            </div>
            <span id="uploadStatusText"></span>
          </div>
        </div>

        <div style="display: flex; gap: 10px">
          <input
            type="text"
            class="message-input"
            id="messageInput"
            placeholder="输入消息..."
            autocomplete="off"
            disabled
          />
          <button class="send-button" id="sendButton" disabled>
            <span id="sendButtonText">发送</span>
            <span
              id="sendButtonLoader"
              class="loader"
              style="display: none"
            ></span>
          </button>
        </div>
      </div>
    </div>

    <div class="image-modal" id="imageModal">
      <div class="image-modal-close" onclick="closeImageModal()">×</div>
      <img id="modalImage" src="" alt="预览图片" />
      <div class="image-info" id="imageInfo"></div>
    </div>

    <div class="notification" id="notification">
      <span id="notificationText"></span>
    </div>

    <script>
      class ChatClient {
        constructor() {
          this.ws = null;
          this.username = null;
          this.reconnectAttempts = 0;
          this.maxReconnectAttempts = 5;
          this.onlineUsers = new Set();
          this.init();
        }

        init() {
          this.getUsername();
          this.setupImageUpload();
          this.setupEventListeners();
          this.connect();
        }

        getUsername() {
          const savedUsername = localStorage.getItem("chat_username");
          if (savedUsername) {
            this.username = savedUsername;
            this.updateUsernameDisplay();
          } else {
            this.promptForUsername();
          }
        }

        promptForUsername() {
          const username = prompt(
            "请输入你的用户名:",
            "用户" + Math.floor(Math.random() * 1000),
          );
          if (username && username.trim()) {
            this.username = username.trim();
            localStorage.setItem("chat_username", this.username);
            this.updateUsernameDisplay();
            return true;
          }
          return false;
        }

        updateUsernameDisplay() {
          document.getElementById("usernameDisplay").textContent =
            this.username;
          const avatar = document.getElementById("userAvatar");
          avatar.textContent = this.username.charAt(0).toUpperCase();

          const colors = [
            "#667eea",
            "#764ba2",
            "#f56565",
            "#ed8936",
            "#38b2ac",
          ];
          const colorIndex =
            this.username
              .split("")
              .reduce((sum, char) => sum + char.charCodeAt(0), 0) %
            colors.length;
          avatar.style.background = colors[colorIndex];
        }

        connect() {
          if (this.ws && this.ws.readyState === WebSocket.OPEN) {
            return;
          }

          if (this.ws) {
            this.ws.close();
          }

          const protocol =
            window.location.protocol === "https:" ? "wss:" : "ws:";
          const wsUrl = `${protocol}//${window.location.host}/ws?username=${encodeURIComponent(this.username)}`;

          this.ws = new WebSocket(wsUrl);
          this.setupWebSocketListeners();
          this.updateConnectionStatus("连接中...", "connecting");
        }

        setupWebSocketListeners() {
          this.ws.onopen = () => {
            console.log("WebSocket连接已打开");
            this.reconnectAttempts = 0;
            this.updateConnectionStatus("已连接", "connected");
            this.showNotification("✅ 已连接到聊天室", "success");
            this.enableInput();

            const welcomeMsg = document.getElementById("welcomeMessage");
            if (welcomeMsg) {
              welcomeMsg.textContent = `欢迎 ${this.username} 加入聊天室！开始聊天吧~`;
            }

            this.onlineUsers.clear();
            this.onlineUsers.add(this.username);
            this.updateUsersList();
          };

          this.ws.onmessage = (event) => {
            try {
              const message = JSON.parse(event.data);
              this.handleMessage(message);
            } catch (error) {
              console.error("消息解析失败:", error, event.data);
            }
          };

          this.ws.onclose = (event) => {
            console.log("WebSocket连接关闭:", event.code, event.reason);
            this.updateConnectionStatus("已断开", "disconnected");
            this.disableInput();

            if (event.code !== 1000) {
              this.showNotification("⚠️ 连接断开，正在重连...", "error");

              if (this.reconnectAttempts < this.maxReconnectAttempts) {
                this.reconnectAttempts++;
                const delay = Math.min(1000 * this.reconnectAttempts, 10000);
                setTimeout(() => this.connect(), delay);
              } else {
                this.showNotification("❌ 重连失败，请刷新页面", "error");
              }
            }
          };

          this.ws.onerror = (error) => {
            console.error("WebSocket错误:", error);
            this.showNotification("❌ 连接错误", "error");
          };
        }

        handleMessage(message) {
          console.log("收到消息:", message);

          switch (message.type) {
            case "chat":
              this.displayChatMessage(message);
              break;
            case "image":
              this.displayImageMessage(message);
              break;
            case "system":
              this.displaySystemMessage(message);
              this.extractUsersFromSystemMessage(message);
              break;
            case "userlist":
              this.handleUserListMessage(message);
              break;
            default:
              console.log("未知消息类型:", message.type);
          }

          this.updateOnlineCount();
        }

        displayImageMessage(message) {
          const messagesContainer =
            document.getElementById("messagesContainer");
          const isSelf = message.username === this.username;

          const messageElement = document.createElement("div");
          messageElement.className = `message ${isSelf ? "self" : "other"}`;

          // 安全地构建图片元素
          const imgUrl = this.escapeHtml(message.image_url);
          const username = this.escapeHtml(message.username);
          const altText = message.text ? this.escapeHtml(message.text) : "图片";

          // 使用事件委托而不是内联onclick
          const imgElement = document.createElement("img");
          imgElement.src = imgUrl;
          imgElement.className = "message-image";
          imgElement.alt = altText;
          imgElement.dataset.url = imgUrl;
          imgElement.dataset.username = username;
          imgElement.addEventListener("click", () => {
            showImageInModal(imgUrl, username);
          });

          messageElement.innerHTML = `
                    <div class="message-header">
                        <span class="message-username">${username}</span>
                        <span class="message-time">${this.formatTime(message.timestamp)}</span>
                    </div>
                `;

          messageElement.appendChild(imgElement);

          if (message.text) {
            const caption = document.createElement("div");
            caption.className = "message-caption";
            caption.style.cssText =
              "font-size: 12px; color: #64748b; margin-top: 5px;";
            caption.textContent = this.escapeHtml(message.text);
            messageElement.appendChild(caption);
          }

          messagesContainer.appendChild(messageElement);
          this.scrollToBottom();
        }

        handleUserListMessage(message) {
          if (message.users && Array.isArray(message.users)) {
            this.onlineUsers = new Set(message.users);
            this.updateUsersList();
            this.showNotification(
              `✅ 已获取在线用户列表 (${message.users.length}人)`,
              "success",
            );
          }
        }

        displayChatMessage(message) {
          const messagesContainer =
            document.getElementById("messagesContainer");
          const isSelf = message.username === this.username;

          const messageElement = document.createElement("div");
          messageElement.className = `message ${isSelf ? "self" : "other"}`;
          messageElement.innerHTML = `
                    <div class="message-header">
                        <span class="message-username">${this.escapeHtml(message.username)}</span>
                        <span class="message-time">${this.formatTime(message.timestamp)}</span>
                    </div>
                    <div class="message-content">${this.escapeHtml(message.text)}</div>
                `;

          messagesContainer.appendChild(messageElement);
          this.scrollToBottom();

          if (isSelf) {
            messageElement.style.opacity = "0.9";
            setTimeout(() => {
              messageElement.style.opacity = "1";
              messageElement.style.transition = "opacity 0.3s";
            }, 100);
          }
        }

        displaySystemMessage(message) {
          const messagesContainer =
            document.getElementById("messagesContainer");

          const systemElement = document.createElement("div");
          systemElement.className = "system-message";
          systemElement.textContent = message.text;

          messagesContainer.appendChild(systemElement);
          this.scrollToBottom();
        }

        extractUsersFromSystemMessage(message) {
          if (!message.text) return;

          const joinMatch = message.text.match(/^(.+?)加入了聊天室$/);
          const leaveMatch = message.text.match(/^(.+?)离开了聊天室$/);

          if (joinMatch) {
            const username = joinMatch[1].trim();
            if (username) {
              this.onlineUsers.add(username);
              this.updateUsersList();
            }
          } else if (leaveMatch) {
            const username = leaveMatch[1].trim();
            if (username) {
              this.onlineUsers.delete(username);
              this.updateUsersList();
            }
          }
        }

        updateUsersList() {
          const usersList = document.getElementById("usersList");
          usersList.innerHTML = "";

          this.addUserToList(this.username, true);

          const otherUsers = Array.from(this.onlineUsers)
            .filter((user) => user !== this.username)
            .sort();

          otherUsers.forEach((username) => {
            this.addUserToList(username, false);
          });

          if (otherUsers.length === 0) {
            const emptyItem = document.createElement("div");
            emptyItem.className = "user-item";
            emptyItem.innerHTML = `
                        <span style="color: #94a3b8; font-style: italic;">
                            暂无其他在线用户
                        </span>
                    `;
            usersList.appendChild(emptyItem);
          }
        }

        addUserToList(username, isCurrentUser) {
          const usersList = document.getElementById("usersList");
          const userElement = document.createElement("div");
          userElement.className = "user-item";
          userElement.innerHTML = `
                    <div class="user-dot"></div>
                    <span>${this.escapeHtml(username)} ${isCurrentUser ? '<span style="color: #667eea;">(你)</span>' : ""}</span>
                `;
          usersList.appendChild(userElement);
        }

        sendMessage(text) {
          if (!text.trim()) {
            return;
          }

          if (!this.ws || this.ws.readyState !== WebSocket.OPEN) {
            this.showNotification("❌ 未连接到服务器", "error");
            return;
          }

          const messageToSend = {
            text: text.trim(),
            timestamp: new Date().toISOString(),
          };

          try {
            this.ws.send(JSON.stringify(messageToSend));
            document.getElementById("messageInput").value = "";
          } catch (error) {
            console.error("发送消息失败:", error);
            this.showNotification("❌ 发送失败，请重试", "error");
          }
        }

        updateConnectionStatus(text, status) {
          const statusText = document.getElementById("statusText");
          const statusDot = document.getElementById("statusDot");

          statusText.textContent = text;
          if (status === "disconnected") {
            statusDot.classList.add("disconnected");
            statusDot.style.animation = "none";
          } else {
            statusDot.classList.remove("disconnected");
            statusDot.style.animation = "pulse 2s infinite";
          }
        }

        updateOnlineCount() {
          const otherUsersCount = Array.from(this.onlineUsers).filter(
            (user) => user !== this.username,
          ).length;
          document.getElementById("onlineCount").textContent =
            otherUsersCount + 1;
        }

        enableInput() {
          document.getElementById("messageInput").disabled = false;
          document.getElementById("sendButton").disabled = false;
          document.getElementById("messageInput").focus();
        }

        disableInput() {
          document.getElementById("messageInput").disabled = true;
          document.getElementById("sendButton").disabled = true;
        }

        setupEventListeners() {
          const messageInput = document.getElementById("messageInput");
          const sendButton = document.getElementById("sendButton");

          sendButton.addEventListener("click", () => {
            this.sendMessage(messageInput.value);
          });

          messageInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
              e.preventDefault();
              this.sendMessage(messageInput.value);
            }
          });

          document
            .querySelector(".connection-status")
            .addEventListener("click", () => {
              if (!this.ws || this.ws.readyState !== WebSocket.OPEN) {
                this.reconnectAttempts = 0;
                this.connect();
                this.showNotification("🔄 尝试重新连接...", "info");
              }
            });

          document
            .getElementById("usersList")
            .addEventListener("click", (e) => {
              const userItem = e.target.closest(".user-item");
              if (
                userItem &&
                !userItem.querySelector("span")?.textContent.includes("(你)")
              ) {
                const username = userItem
                  .querySelector("span")
                  .textContent.replace(" (你)", "")
                  .trim();
                this.showNotification(`点击了用户: ${username}`, "info");
              }
            });

          document
            .getElementById("messagesContainer")
            .addEventListener("dblclick", () => {
              this.scrollToBottom();
            });
        }

        showNotification(text, type = "info") {
          const notification = document.getElementById("notification");
          const notificationText = document.getElementById("notificationText");

          notificationText.textContent = text;
          notification.className = `notification ${type}`;

          void notification.offsetWidth;

          notification.classList.add("show");

          setTimeout(() => {
            notification.classList.remove("show");
          }, 3000);
        }

        scrollToBottom() {
          const container = document.getElementById("messagesContainer");
          container.scrollTo({
            top: container.scrollHeight,
            behavior: "smooth",
          });
        }

        formatTime(timestamp) {
          const date = new Date(timestamp);
          const now = new Date();
          const diffMs = now - date;
          const diffMins = Math.floor(diffMs / 60000);

          if (diffMins < 1) {
            return "刚刚";
          }

          if (diffMins < 60) {
            return `${diffMins}分钟前`;
          }

          if (date.toDateString() === now.toDateString()) {
            return date.toLocaleTimeString("zh-CN", {
              hour: "2-digit",
              minute: "2-digit",
            });
          }

          return date.toLocaleString("zh-CN", {
            month: "short",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit",
          });
        }

        escapeHtml(text) {
          const div = document.createElement("div");
          div.textContent = text;
          return div.innerHTML;
        }

        setupImageUpload() {
          const imageInput = document.getElementById("imageInput");
          const uploadStatus = document.getElementById("uploadStatus");
          const uploadProgress = document.getElementById("uploadProgress");
          const uploadProgressBar =
            document.getElementById("uploadProgressBar");
          const uploadStatusText = document.getElementById("uploadStatusText");

          imageInput.addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const allowedTypes = [
              "image/jpeg",
              "image/png",
              "image/gif",
              "image/bmp",
              "image/webp",
            ];

            if (!allowedTypes.includes(file.type)) {
              this.showNotification("❌ 不支持的文件类型", "error");
              return;
            }

            if (file.size > 10 * 1024 * 1024) {
              this.showNotification("❌ 图片大小不能超过10MB", "error");
              return;
            }

            this.uploadImage(file);
            e.target.value = "";
          });
        }

        async uploadImage(file) {
          // 只使用表单数据，不使用查询参数
          const formData = new FormData();
          formData.append("image", file);
          formData.append("username", this.username);

          // 调试：打印表单数据
          console.log("上传表单数据:");
          for (let [key, value] of formData.entries()) {
            console.log(
              `${key}:`,
              value instanceof File
                ? `${value.name} (${value.size} bytes)`
                : value,
            );
          }

          const uploadProgress = document.getElementById("uploadProgress");
          const uploadProgressBar =
            document.getElementById("uploadProgressBar");
          const uploadStatusText = document.getElementById("uploadStatusText");

          uploadProgress.style.display = "block";
          uploadStatusText.textContent = "上传中...";

          try {
            // 使用相对路径
            const response = await fetch("/upload/image", {
              method: "POST",
              body: formData,
              // 不要设置 Content-Type，让浏览器自动设置
            });

            console.log("响应状态:", response.status, response.statusText);

            const result = await response.json();
            console.log("响应数据:", result);

            if (response.ok) {
              uploadProgressBar.style.width = "100%";
              uploadStatusText.textContent = "上传成功！";
              this.showNotification("✅ 图片发送成功", "success");

              setTimeout(() => {
                uploadProgress.style.display = "none";
                uploadProgressBar.style.width = "0%";
                uploadStatusText.textContent = "";
              }, 3000);
            } else {
              throw new Error(result.error || result.detail || "上传失败");
            }
          } catch (error) {
            console.error("图片上传失败:", error);
            uploadStatusText.textContent = "上传失败";
            uploadStatusText.style.color = "#ef4444";
            this.showNotification(`❌ 图片上传失败: ${error.message}`, "error");

            setTimeout(() => {
              uploadProgress.style.display = "none";
              uploadProgressBar.style.width = "0%";
              uploadStatusText.textContent = "";
              uploadStatusText.style.color = "";
            }, 3000);
          }
        }
      }

      function showImageInModal(imgUrl, username) {
        const modal = document.getElementById("imageModal");
        const modalImage = document.getElementById("modalImage");
        const imageInfo = document.getElementById("imageInfo");

        modalImage.src = imgUrl;
        imageInfo.textContent = `来自: ${username}`;
        modal.style.display = "flex";

        modal.addEventListener("click", function (e) {
          if (e.target === this) {
            closeImageModal();
          }
        });

        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") {
            closeImageModal();
          }
        });
      }

      function closeImageModal() {
        document.getElementById("imageModal").style.display = "none";
      }

      // 只有一个 DOMContentLoaded 监听器
      document.addEventListener("DOMContentLoaded", () => {
        if (!window.WebSocket) {
          alert("您的浏览器不支持WebSocket，请使用现代浏览器访问。");
          return;
        }

        window.chatClient = new ChatClient();

        document.addEventListener("keydown", (e) => {
          if (e.ctrlKey && e.key === "k") {
            e.preventDefault();
            document.getElementById("messageInput").focus();
          }

          if (e.ctrlKey && e.key === "i") {
            e.preventDefault();
            document.getElementById("imageInput").click();
          }

          if (e.key === "Escape") {
            document.getElementById("messageInput").value = "";
          }
        });

        document.addEventListener("visibilitychange", () => {
          if (
            !document.hidden &&
            window.chatClient &&
            (!window.chatClient.ws ||
              window.chatClient.ws.readyState !== WebSocket.OPEN)
          ) {
            window.chatClient.connect();
          }
        });
      });
    </script>
  </body>
</html>
